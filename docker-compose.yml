services:
  llm-prompt-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-prompt-router
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      PORT: 3000
      CONFIDENCE_THRESHOLD: "${CONFIDENCE_THRESHOLD:-0.7}"
      CLASSIFIER_MODEL: "${CLASSIFIER_MODEL:-gpt-4o-mini}"
      RESPONDER_MODEL: "${RESPONDER_MODEL:-gpt-4o-mini}"
      LOG_FILE: "/app/logs/route_log.jsonl"
    volumes:
      # Persist the JSONL log outside the container
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
